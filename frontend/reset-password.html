<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>Reset Password | UNN E-Library</title>
  <link rel="stylesheet" href="./css/entry.css" />
  <link rel="stylesheet" href="./css/password-reset.css" />
  <link rel="stylesheet" href="./css/three-ui-fixes.css" />
</head>
<body class="auth-body">
  <header class="auth-top"><a class="brand" href="./landing.html">UNN <small>E-LIBRARY</small></a><a href="./login.html">← Sign in</a></header>
  <main class="auth-shell">
    <aside class="auth-brand">
      <div class="auth-insignia">UNN</div>
      <p class="eyebrow">UNIVERSITY OF NIGERIA, NSUKKA</p>
      <h1>Knowledge deserves<br />secure access.</h1>
      <p>Recover access to your academic library account safely.</p>
    </aside>
    <section class="auth-card reset-card">
      <p class="eyebrow">ACCOUNT RECOVERY</p>
      <h2 id="reset-title">Forgot your password?</h2>
      <p class="subtitle" id="reset-subtitle">Enter your account email address to request a recovery link.</p>
      <p id="reset-message" class="form-status" role="status" aria-live="polite"></p>
      <form id="reset-request-form">
        <label for="reset-email">Email address</label>
        <input id="reset-email" type="email" autocomplete="email" required placeholder="you@unn.edu.ng" />
        <button class="primary full" type="submit">Send reset link</button>
      </form>
      <form id="reset-change-form" hidden>
        <label for="reset-new-password">New password</label>
        <input id="reset-new-password" type="password" minlength="12" maxlength="128" required autocomplete="new-password" placeholder="At least 12 characters" />
        <label for="reset-confirm-password">Confirm new password</label>
        <input id="reset-confirm-password" type="password" minlength="12" maxlength="128" required autocomplete="new-password" placeholder="Re-enter your password" />
        <button class="primary full" type="submit">Update password</button>
      </form>
      <p class="reset-footnote">Remember your password? <a href="./login.html">Return to sign in</a></p>
    </section>
  </main>
  <script type="module" src="./js/password-reset-page.js"></script>
</body>
</html>
